version: 2
updates:
  # Identificador oficial de GitHub para el ecosistema JavaScript; pnpm sigue siendo el gestor.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Santiago
    groups:
      electron-toolchain:
        patterns:
          - electron
          - electron-builder
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: America/Santiago
    open-pull-requests-limit: 5
