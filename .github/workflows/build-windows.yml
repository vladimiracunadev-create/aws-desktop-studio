name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package, attest and release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: npm run dist:win
      - name: Generate SBOM and SHA-256 checksums
        shell: pwsh
        run: |
          npm sbom --sbom-format cyclonedx | Out-File -Encoding utf8 dist/aws-desktop-studio-sbom.cdx.json
          Get-ChildItem dist -File | Where-Object {
            $_.Name -match '^AWS-Desktop-Studio-.*\.exe(\.blockmap)?$' -or
            $_.Name -eq 'latest.yml' -or
            $_.Name -eq 'aws-desktop-studio-sbom.cdx.json'
          } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-desktop-studio-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/*.json
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/*.json
            dist/SHA256SUMS.txt
