name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package, attest and release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Report build-tool advisories
        continue-on-error: true
        run: pnpm audit --dev --audit-level=high
      - run: pnpm run dist:win
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/aws-desktop-studio-sbom.cdx.json
          upload-artifact: false
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object {
            $_.Name -match '^AWS-Desktop-Studio-.*\.exe(\.blockmap)?$' -or
            $_.Name -eq 'latest.yml' -or
            $_.Name -eq 'aws-desktop-studio-sbom.cdx.json'
          } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aws-desktop-studio-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/*.json
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }} · Implementación en desarrollo
          generate_release_notes: true
          append_body: true
          body: |
            > [!WARNING]
            > Esta versión identifica un despliegue inicial de una implementación en desarrollo. Los artefactos Windows no certifican que el acceso AWS esté resuelto para todas las modalidades ni que la aplicación esté lista para producción.

            Consulta `PROJECT_STATUS.md`, `ROADMAP.md` y `docs/08-referencias-y-plan-de-madurez.md` antes de usar los binarios.
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/*.json
            dist/SHA256SUMS.txt
